<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="100%" height="100%" fill="#ffffff"/><text x="55" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Reproducible analysis pipeline</text><text x="55" y="82" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#475569">From public evidence to baseline frontier, operationalization sensitivity, and bounded engineering interpretation</text><rect x="45" y="125" width="205" height="130" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/><text x="63" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">1 • Public source</text><text x="63" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">UCI Concrete Slump Test</text><text x="63" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">103 laboratory experiments</text><text x="63" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">DOI 10.24432/C5FG7D</text><rect x="290" y="125" width="205" height="130" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="308" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">2 • Validate evidence</text><text x="308" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Parse source variables</text><text x="308" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Check released metrics</text><text x="308" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Record source SHA 256</text><rect x="535" y="125" width="205" height="130" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="553" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">3 • Objective table</text><text x="553" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Cement • minimize</text><text x="553" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Slump • baseline maximize</text><text x="553" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">28 day strength • maximize</text><line x1="250" y1="190" x2="278" y2="190" stroke="#475569" stroke-width="2"/><polygon points="278,184 290,190 278,196" fill="#475569"/><line x1="495" y1="190" x2="523" y2="190" stroke="#475569" stroke-width="2"/><polygon points="523,184 535,190 523,196" fill="#475569"/><line x1="740" y1="190" x2="785" y2="190" stroke="#475569" stroke-width="2"/><line x1="785" y1="190" x2="785" y2="338" stroke="#475569" stroke-width="2"/><line x1="785" y1="190" x2="785" y2="510" stroke="#475569" stroke-width="2"/><polygon points="773,332 785,338 773,344" fill="#475569"/><polygon points="773,504 785,510 773,516" fill="#475569"/><rect x="815" y="275" width="330" height="145" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4"/><text x="833" y="306" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">4A • Baseline frontier</text><text x="833" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Exact pairwise Pareto dominance</text><text x="833" y="354" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">All 103 observations eligible</text><text x="833" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">23 efficient observations • 22.3%</text><rect x="815" y="447" width="330" height="145" rx="15" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.4"/><text x="833" y="478" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">4B • Sensitivity frontiers</text><text x="833" y="504" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Omit slump objective → 10</text><text x="833" y="526" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Slump ≥ 10 cm → 10</text><text x="833" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Slump ≥ 20 cm → 8</text><rect x="45" y="320" width="280" height="145" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="63" y="351" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">5 • Stability metrics</text><text x="63" y="377" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Frontier size</text><text x="63" y="399" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Baseline overlap and retention</text><text x="63" y="421" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Jaccard similarity • exact IDs</text><rect x="365" y="320" width="360" height="145" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="383" y="351" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">6 • Evidence integrity</text><text x="383" y="377" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Offline recomputation from packaged table</text><text x="383" y="399" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Internet rebuild against public UCI source</text><text x="383" y="421" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Tests + hashes + deterministic figures</text><line x1="815" y1="348" x2="713" y2="392" stroke="#475569" stroke-width="2"/><polygon points="713,386 725,392 713,398" fill="#475569"/><line x1="815" y1="520" x2="713" y2="420" stroke="#475569" stroke-width="2"/><polygon points="713,414 725,420 713,426" fill="#475569"/><line x1="325" y1="392" x2="353" y2="392" stroke="#475569" stroke-width="2"/><polygon points="353,386 365,392 353,398" fill="#475569"/><rect x="250" y="525" width="475" height="120" rx="15" fill="#fef2f2" stroke="#f87171" stroke-width="1.4"/><text x="268" y="556" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">7 • Interpretation boundary</text><text x="268" y="582" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Frontier membership is conditional on the declared decision model.</text><text x="268" y="604" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">No field ready concrete recommendation is inferred.</text><line x1="545" y1="465" x2="533" y2="525" stroke="#475569" stroke-width="2"/><polygon points="533,519 545,525 533,531" fill="#475569"/><text x="55" y="680" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#334155">Key design principle: hold the observations fixed, change only the role of slump, then quantify how the efficient set changes.</text></svg>