" font-size="18" font-weight="700" text-anchor="middle">8</text><text x="845" y="498" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Slump ≥20 cm</text><text x="845" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">baseline retention 0.348</text><text x="50" y="550" font-family="Arial, sans-serif" font-size="13">Thresholds are analytical sensitivity checks, not universal engineering requirements.</text></svg>